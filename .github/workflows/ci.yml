# VAML POC — CI matrix (S004)
#
# Two lanes, exactly matching ADR-007's core compiler matrix:
#   windows-msvc : Windows (rolling `windows-latest`, VS 2026 cl.exe) -> preset msvc-debug
#   ubuntu-clang : Linux (rolling `ubuntu-latest`, clang++)          -> preset clang-debug
#
# Both lanes run the identical configure -> build -> ctest sequence, reusing the
# S002/S003 CMake presets verbatim (no build logic duplicated here). Warnings are
# escalated to errors by the presets (VAML_WARNINGS_AS_ERRORS=ON), so a single
# warning fails the lane. If the matrix is extended later (e.g. a windows-clang
# job), add it here as a real job — do not leave dead/commented lanes.
#
# Market: public repo -> GitHub-hosted runners are free. No self-hosted runners,
# no pinned image labels (rolling -latest keeps the MSVC lane on the same VS as
# local dev and follows future platform migrations).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows MSVC (VS 2026)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Load the VS developer environment (vcvars64) and export PATH so cl.exe is
      # available in every subsequent step. setup-msbuild only adds MSBuild.exe to
      # PATH (not cl.exe), which is why configure previously could not find `cl`.
      - name: Set up MSVC dev environment (cl.exe / vcvars on PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      # Bootstrap the vendored deps (S160/S161 dep-migration): the deps live
      # OUTSIDE this repo (public vaml-deps) in the gitignored third_party/deps
      # folder, so CI must clone them here before configure. This is the uniform
      # one-liner every host (runner / VM / laptop / dev box) uses — no repo bloat,
      # no drift. `--depth 1` = source only, builds identically on all hosts.
      - name: Fetch vendored deps into third_party/deps
        shell: pwsh
        run: git clone --depth 1 https://github.com/strawhecker/vaml-deps.git third_party/deps

      - name: Configure (msvc-debug preset)
        shell: pwsh
        run: cmake --preset msvc-debug

      - name: Build (msvc-debug preset)
        shell: pwsh
        run: cmake --build --preset msvc-debug

      - name: Test (ctest --preset msvc-debug)
        shell: pwsh
        run: ctest --preset msvc-debug

  ubuntu-clang:
    name: Ubuntu Clang
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Clang, Ninja and GPU stack deps
        run: |
          sudo apt-get update
          # libglfw3-dev = the X11 platform libs GLFW's vendored build links on
          #   Linux (GLFW source itself is vendored and built in-tree — no
          #   version-drift; this install supplies the X11 runtime/platform libs).
          # xorg-dev = the full X11 dev header set GLFW's X11 backend requires
          #   (xinerama/xrandr/xkb/xcursor/xi/xext) with the correct inter-package
          #   dependency resolution.
          # libvulkan-dev = the Vulkan LOADER (.so) only; the API headers come
          #   from the vendored vulkan-headers set, so no header drift.
          sudo apt-get install -y clang ninja-build libglfw3-dev libvulkan-dev xorg-dev

      # Bootstrap the vendored deps (S160/S161 dep-migration): same uniform
      # one-liner as the Windows lane — clone public vaml-deps into the gitignored
      # third_party/deps folder before configure. `--depth 1` = source only.
      - name: Fetch vendored deps into third_party/deps
        run: git clone --depth 1 https://github.com/strawhecker/vaml-deps.git third_party/deps

      - name: Configure (clang-debug preset)
        run: cmake --preset clang-debug

      - name: Build (clang-debug preset)
        run: cmake --build --preset clang-debug

      - name: Test (ctest --preset clang-debug)
        run: ctest --preset clang-debug
